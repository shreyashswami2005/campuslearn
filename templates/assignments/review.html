{% extends 'base.html' %}
{% load static %}

{% block title %}Review Submission{% endblock %}

{% block content %}
<div class="container py-4">
  <h2 class="mb-3">Review: {{ submission.assignment.title }} by {{ submission.student.username }}</h2>
  <form method="post" class="glass p-4 rounded">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary mt-3">Save Review</button>
  </form>
  <hr class="my-4" />
  <h5>Current File:</h5>
  <a href="{{ submission.file.url }}" class="btn btn-outline-secondary" target="_blank">Download Submission</a>
</div>
{% endblock %}
