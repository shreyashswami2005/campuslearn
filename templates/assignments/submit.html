{% extends 'base.html' %}
{% load static %}

{% block title %}Submit Assignment{% endblock %}

{% block content %}
<div class="container py-4">
  <h2 class="mb-3">Submit: {{ assignment.title }}</h2>
  <form method="post" enctype="multipart/form-data" class="glass p-4 rounded">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success mt-3">Upload</button>
  </form>
</div>
{% endblock %}
