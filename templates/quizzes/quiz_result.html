{% extends 'base.html' %}
{% block title %}Quiz Results - {{ quiz.title }}{% endblock %}

{% block content %}
<div class="container py-4">
  <h2>Results for {{ quiz.title }}</h2>
  <div class="alert alert-info">
    <h4>Your Score: {{ attempt.score|floatformat:1 }}%</h4>
  </div>
  <a href="{% url 'courses:detail' slug=course.slug %}" class="btn btn-primary">Back to Course</a>
</div>
{% endblock %}
