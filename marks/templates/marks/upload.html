{% extends 'base.html' %}
{% load static %}

{% block title %}Upload Internal Marks - {{ course.title }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: auto; padding: 2rem; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);">
    <h2 class="heading" style="color: #f0f0f0;">Upload Marks for {{ course.title }}</h2>
    <form method="post" novalidate style="display: flex; flex-direction: column; gap: 1rem;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="background: linear-gradient(135deg, #ff7e5f, #feb47b); color: #fff; padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s;">Save Mark</button>
    </form>
</div>
{% endblock %}
