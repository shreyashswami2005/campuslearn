{% extends "base.html" %}
{% load static %}
{% block title %}Upload Marks{% endblock %}
{% block content %}
<div class="container py-5 glass">
  <h2 class="mb-4">Upload Marks for {{ course.title }}</h2>
  <form method="post" class="needs-validation" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary mt-3">Save Mark</button>
  </form>
</div>
{% endblock %}
